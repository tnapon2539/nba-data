name: nba-data
on:
  schedule:
    - cron: '*/5 * * * *'   # อัปเดต board.json ทุก ~5 นาที (GitHub มักล่าช้า/ข้ามรอบ → ไม่ใช่ Real-time)
    - cron: '0 6 * * *'     # ทุกวัน 13:00 เวลาไทย: ผลเกม/สถิติผู้เล่นใหม่ + ตารางแข่ง + บาดเจ็บ
  workflow_dispatch:
    inputs:
      mode:
        description: 'history = ย้อนหลังเต็ม | board = เฉพาะ board'
        default: 'history'
      seasons:
        description: 'จำนวนฤดูกาลย้อนหลัง (1-5)'
        default: '3'
      espn_scan_all:
        description: 'ESPN สำรอง: สแกนทุกวัน (ช้า) true/false'
        default: 'false'
permissions:
  contents: write
concurrency:
  group: nba-data
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: restore previous data
        run: |
          mkdir -p data
          git fetch origin data --depth=1 && git --work-tree=data checkout FETCH_HEAD -- . || echo "ยังไม่มี branch data (รันครั้งแรก)"
      - name: run unit tests
        run: |
          if [ -f tests/test_fetch_nba.py ]; then python3 -m unittest discover -s tests -p "test_fetch_nba.py"; else echo "ไม่มีโฟลเดอร์ tests — ข้ามขั้นตอนนี้"; fi
      - name: fetch (ไม่ทำให้ขั้นตอนถัดไปหยุด เพื่อให้ status.json ถูกเผยแพร่เสมอ)
        id: fetch
        run: |
          MODE="${{ github.event.inputs.mode }}"
          SEASONS="${{ github.event.inputs.seasons }}"; SEASONS="${SEASONS:-3}"
          SCAN=""; [ "${{ github.event.inputs.espn_scan_all }}" = "true" ] && SCAN="--espn-scan-all"
          if [ "${{ github.event.schedule }}" = "*/5 * * * *" ] || [ "$MODE" = "board" ]; then
            python3 scripts/fetch_nba.py --out data --board-only && rc=0 || rc=$?
          else
            python3 scripts/fetch_nba.py --out data --seasons "$SEASONS" $SCAN && rc=0 || rc=$?
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: publish to branch data
        run: |
          cd data
          rm -rf .git
          git init -q
          git checkout -q -b data
          git config user.name "nba-data-bot"
          git config user.email "nba-data-bot@users.noreply.github.com"
          git add -A
          git commit -qm "data $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
      - name: fail if every source is blocked
        if: steps.fetch.outputs.rc != '0'
        run: |
          echo "::error::ทุกแหล่งข้อมูลถูกบล็อก/ล่ม (exit ${{ steps.fetch.outputs.rc }}) — ดู data/status.json บน branch data"
          exit 1
